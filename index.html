<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Both themes are real here (the page follows the system unless overridden), so the browser
         is told before any CSS loads, and the address bar is given each theme's own background. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>Enjambre sísmico de Chaparral (Tolima) · valor b</title>
    <meta
      name="description"
      content="Catálogo del SGC y valor b de Gutenberg–Richter para el enjambre sísmico de Chaparral (Tolima), que comenzó el 20 de septiembre de 2026."
    />
    <!-- The page is shared as a link, person to person. Spanish, like the page's default; the
         copy is deliberately the same as the title and the description above. This file is
         the home zone's page (HOME_ZONE, Chaparral) and the template for the other zones': the build writes each one's with
         these tags swapped for its own (core/zone-pages.ts, which also holds this copy). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Enjambre sísmico de Chaparral (Tolima)" />
    <meta property="og:title" content="Enjambre sísmico de Chaparral (Tolima) · valor b" />
    <meta
      property="og:description"
      content="Catálogo del SGC y valor b de Gutenberg–Richter para el enjambre sísmico de Chaparral (Tolima), que comenzó el 20 de septiembre de 2026."
    />
    <meta property="og:url" content="https://choco.sgc-swarm.workers.dev/" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
