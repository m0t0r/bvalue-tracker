version: 2

# Patch and minor updates arrive as one grouped PR per ecosystem, which
# dependabot-automerge.yml merges and deploys once CI passes. Majors arrive one PR each
# and wait for a person. Security updates are not delayed by the cooldown.
updates:
  - package-ecosystem: npm # covers pnpm
    directory: /
    schedule:
      interval: weekly
    # A week's delay before proposing a new release: most malicious or broken publishes
    # are yanked within days, and these PRs deploy without a person looking at them.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # A PR of its own, outside the group that merges and deploys by itself: a release can start
        # compiling a function it used to skip, which changes when that function renders. A person
        # runs `pnpm tsx scripts/react-compiler.ts skips` on it (docs/development.md, "React Compiler").
        exclude-patterns: ["babel-plugin-react-compiler"]
    ignore:
      # @cloudflare/vitest-plugin does not support vitest 5 yet (docs/development.md).
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # babel-plugin-react-compiler 1.0 on Babel 8 silently skips every component with a
      # defaulted prop (docs/development.md, "React Compiler"), with no error, so do not propose
      # it until the compiler supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      # Follows the Node LTS that CI and engines.node run, not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
