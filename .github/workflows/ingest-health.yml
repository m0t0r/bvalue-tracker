name: Ingest health

# Asks production one question every half hour: how long is it since ingest last
# succeeded? Both of this project's real outages looked identical from outside — the
# Worker up, the page rendering, /api/health answering ok — while the catalogue sat nine
# hours stale. Nothing external could tell, because nothing external could ask.
#
# Cloudflare has no Workers alert on the free plan, so the alarm is this job failing:
# GitHub emails the repository owner on a failed scheduled run. That is the whole
# notification system, and it costs nothing.
#
# It calls /api/health, which is the one route open to a caller with no same-origin
# signal; every other /api/ route answers 403 to curl by design.

# Switched off 2026-09-20 while the Worker was being refused with 410 — the cause was known
# and a failing run every half hour said nothing new — and back on 2026-09-22 once ingest had
# been succeeding for a day. If it has to go off again, write down the condition for turning
# it back on, and check that condition: it stayed off for a day after this one was met.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Ask production how fresh the catalogue is
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          # Two wide ticks. One failed run only stands the fast lane down — the wide tick
          # keeps probing SGC every 30 minutes and is what lets the fast lane back in — so
          # a single failure must not page anyone. An hour of no success is a real fault,
          # whether that is SGC refusing us or this Worker being killed mid-run. Chocó
          # runs on the wide ticks only, so the same hour is two of its runs as well.
          STALE_AFTER_S: "3600"
        # Through env rather than interpolated into the script: a repository variable
        # should not be able to become shell. Same rule as the deploy smoke test.
        run: |
          set -o pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            "$PRODUCTION_URL/api/health" | tee health.json
          # The script is one single-quoted shell string: an apostrophe anywhere in it, comments
          # included, ends the string and bash runs the rest as a command (exit 127, 2026-09-23).
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const h = JSON.parse(readFileSync("health.json", "utf8"));
            const stale = Number(process.env.STALE_AFTER_S);
            if (h.ok !== true) { console.error("health says not ok"); process.exit(1); }
            // Each zone is its own catalogue, and one can go stale while the other is fine.
            // The top-level age is already that of the stalest zone; the zones are read by name so
            // the failure says which, and so a Worker that stopped reporting them fails too.
            const zones = h.zones && typeof h.zones === "object" ? Object.entries(h.zones) : [];
            if (zones.length === 0) {
              console.error(`no per-zone health in response: ${JSON.stringify(h)}`);
              process.exit(1);
            }
            let failed = false;
            for (const [zone, z] of zones) {
              if (typeof z.ingestAgeS !== "number" || z.ingestAgeS > stale) {
                // The first thing to read is worker/log.ts output: a "reaped abandoned runs"
                // warning means an invocation was killed, an "ingest failed" line carries
                // SGC HTTP status. docs/operations.md, "Debugging production", has the queries.
                console.error(
                  typeof z.ingestAgeS === "number"
                    ? `${zone} is stale: last successful ingest ${z.ingestAgeS}s ago (limit ${stale}s)`
                    : `${zone} has no successful ingest at all`,
                );
                failed = true;
              } else {
                console.log(`${zone} ok: last successful ingest ${z.ingestAgeS}s ago, ${z.totalEvents} events`);
              }
            }
            if (failed) process.exit(1);
            // Not `=== null`: a *missing* field must fail too. A rollback to a Worker
            // version from before ingestAgeS existed, or an edge still serving the old
            // version mid-deploy, answers without it — and `undefined === null` is false
            // and `undefined > 3600` is false, so this job would pass, green, through
            // exactly the nine-hour-stale outage it exists to catch.
            if (typeof h.ingestAgeS !== "number") {
              console.error(`no usable ingestAgeS in health response: ${JSON.stringify(h)}`);
              process.exit(1);
            }
            // The per-zone loop above already covers this unless a zone is missing from `zones`.
            if (h.ingestAgeS > stale) {
              console.error(`catalogue is stale: stalest zone last succeeded ${h.ingestAgeS}s ago (limit ${stale}s)`);
              process.exit(1);
            }
          '
