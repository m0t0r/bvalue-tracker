name: CI

on:
  push:
    branches: [main]
  pull_request:

# Neither job calls the GitHub API; say so rather than inheriting the default scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      # Migrations first: the new Worker may depend on the new schema.
      - run: pnpm exec wrangler d1 migrations apply sgc-swarm --remote
      - run: pnpm exec wrangler deploy
      - name: Smoke test
        if: vars.PRODUCTION_URL != ''
        # Through env, not interpolated into the script: a repository variable should not
        # be able to become shell. /api/health is the one route open to a non-browser
        # caller; every other /api/ route now requires a same-origin signal.
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # pipefail: without it the pipeline's status is tee's, so a failed curl fell
          # through to node, which then died on an empty health.json and hid the cause.
          set -o pipefail
          # --retry-all-errors because a just-deployed version takes a few seconds to
          # reach every edge, and the version still being served 404s a route that this
          # deploy adds. Plain --retry only covers connection errors and 5xx, so the
          # first 404 ended the step (this is how /api/health failed on its own deploy).
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/api/health" | tee health.json
          node -e 'const s=require("./health.json"); if (s.ok !== true || typeof s.totalEvents !== "number") process.exit(1)'
