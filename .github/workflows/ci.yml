name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      # Migrations first: the new Worker may depend on the new schema.
      - run: pnpm exec wrangler d1 migrations apply sgc-swarm --remote
      - run: pnpm exec wrangler deploy
      - name: Smoke test
        if: vars.PRODUCTION_URL != ''
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_URL }}/api/status" | tee status.json
          node -e 'const s=require("./status.json"); if (typeof s.totalEvents !== "number") process.exit(1)'
