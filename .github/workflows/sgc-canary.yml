name: SGC canary

# Hits the real SGC server once a day so a change to their form or table
# layout is noticed from CI, not only from a failing cron in production.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

# Reads the repository and nothing else; say so rather than inheriting the default scope.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; keep the token out of .git/ for later steps.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
