name: SGC canary

# Hits the real SGC server so a change to their form or table layout is noticed from CI, not
# only from a failing sync in production.
#
# By hand only since 2026-10-11, when the site went to on-demand syncing: the daily schedule was a
# request to SGC that no reader asked for. Run it before or after a sync that failed, to tell a
# change on SGC's side from a fault on ours. Put `schedule` back if the Worker reads SGC on a cron
# again.
on:
  workflow_dispatch:

# Reads the repository and nothing else; say so rather than inheriting the default scope.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of .git/ for later steps.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
