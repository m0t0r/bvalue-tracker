name: SGC canary

# Hits the real SGC server once a day so a change to their form or table
# layout is noticed from CI, not only from a failing cron in production.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

# Reads the repository and nothing else; say so rather than inheriting the default scope.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of .git/ for later steps.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
