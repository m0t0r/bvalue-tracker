<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Epicentro">
  <!-- An epicentre: the mark the map uses, in the page's blue (--chart-1). One colour for both
       themes, because a tab strip can be either and this blue reads on both. -->
  <g fill="none" stroke="#2a78d6" stroke-width="2.5">
    <circle cx="16" cy="16" r="13" opacity="0.28" />
    <circle cx="16" cy="16" r="8.5" opacity="0.6" />
  </g>
  <circle cx="16" cy="16" r="4.5" fill="#2a78d6" />
</svg>
