<!doctype html>
<!-- PROTOTYPE (branch prototype/3d): renders the monitor's map at the 3D block's bounds, once, to bake
     the block's top. See src/insights/prototype-3d/bake-basemap.ts. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      #map {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/insights/prototype-3d/bake-basemap.ts"></script>
  </body>
</html>
